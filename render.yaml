services:
  - type: web
    name: ptech-portfolio-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: ptech-portfolio-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://ptechnologies.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://ptechnologies.vercel.app
      - key: LOG_CHANNEL
        value: stderr
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: log

databases:
  - name: ptech-portfolio-db
    databaseName: ptech_portfolio
    user: ptech_portfolio
    plan: free
    region: singapore
    postgresMajorVersion: 17
    ipAllowList: []
