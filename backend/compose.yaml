services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in backend/.env}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in backend/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
    ports:
      - "${DB_PORT:?Set DB_PORT in backend/.env}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:?Set DB_USERNAME in backend/.env} -d ${DB_DATABASE:?Set DB_DATABASE in backend/.env}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
