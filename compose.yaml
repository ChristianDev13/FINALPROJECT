
services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: myproject
      DB_USERNAME: laravel
      DB_PASSWORD: change_this_password

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: myproject
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: change_this_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d myproject"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
